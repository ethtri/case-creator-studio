name: PR Hygiene

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR evidence
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GOVERNANCE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'governance-exception') }}
        shell: bash
        run: |
          node <<'NODE'
          const body = process.env.PR_BODY || '';
          const exception = process.env.GOVERNANCE_EXCEPTION === 'true';

          if (exception) {
            console.log('PR hygiene bypassed by a maintainer-applied governance-exception label.');
            process.exit(0);
          }

          const errors = [];
          const requiredSections = [
            'Issue traceability',
            'Summary',
            'Files changed',
            'Verification',
            'How to test',
            'Docs/status updates',
            'Risk/overlap',
            'Workflow confirmation',
          ];

          const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const sectionBody = (heading) => {
            const pattern = new RegExp(
              `^##[ \\t]+${escapeRegex(heading)}[ \\t]*\\r?\\n([\\s\\S]*?)(?=^##[ \\t]+|(?![\\s\\S]))`,
              'im',
            );
            const match = body.match(pattern);
            return match?.[1]
              ?.replace(/<!--[\s\S]*?-->/g, '')
              .trim() || '';
          };

          for (const heading of requiredSections) {
            const content = sectionBody(heading);
            if (!content) errors.push(`Missing or empty section: ## ${heading}`);
          }

          if (!/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/i.test(body)) {
            errors.push('Issue traceability must include a GitHub closing keyword such as "Closes #65".');
          }

          if (/\b(?:TODO|TBD)\b/i.test(body)) {
            errors.push('Replace every TODO/TBD placeholder with evidence or an explicit N/A reason.');
          }

          const unchecked = body.match(/^- \[ \] /gm) || [];
          if (unchecked.length > 0) {
            errors.push(`Complete every checklist item before merge (${unchecked.length} unchecked).`);
          }

          const requiredCommands = [
            'npm ci',
            'npm run lint --if-present',
            'npm run type-check',
            'npm run build',
            'npm test --if-present',
          ];
          for (const command of requiredCommands) {
            const pattern = new RegExp('^- \\[x\\] `' + escapeRegex(command) + '`', 'im');
            if (!pattern.test(body)) errors.push(`Verification must check off: ${command}`);
          }

          if (errors.length > 0) {
            console.error('Pull request description is incomplete:');
            for (const error of errors) console.error(`- ${error}`);
            process.exit(1);
          }

          console.log('Pull request description contains the required traceability and evidence.');
          NODE
