name: PR Hygiene

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          GOVERNANCE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'governance-exception') }}
        run: node scripts/validate-pr-body.mjs
