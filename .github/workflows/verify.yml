name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit full dependency tree
        run: npm run audit

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Validate public claims
        run: npm run claims:check

      - name: Test
        run: npm test --if-present

      - name: Install accessibility test browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility and mobile smoke
        run: npm run test:a11y

      - name: Upload accessibility browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-browser-evidence
          path: output/playwright/
          if-no-files-found: warn

  shipping-offer-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shipping_offer_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: shipping_offer_ci
      PGUSER: postgres
      PGPASSWORD: ci_fixture_only
    steps:
      - uses: actions/checkout@v7
      - name: Verify capped offer with concurrent PostgreSQL connections
        run: bash scripts/shipping-offer-postgres-test.sh
