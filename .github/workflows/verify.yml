name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Validate public claims
        run: npm run claims:check

      - name: Test
        run: npm test --if-present

      - name: Install accessibility test browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility and mobile smoke
        run: npm run test:a11y

      - name: Upload accessibility browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-browser-evidence
          path: output/playwright/
          if-no-files-found: warn
