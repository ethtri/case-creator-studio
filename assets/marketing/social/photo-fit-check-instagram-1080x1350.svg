<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Will this photo work crop check</title>
  <desc id="desc">A four-by-five Snapcase photo-crop checklist showing room around the subject, important details inside the crop, and a reminder to preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f4f8"/><stop offset="1" stop-color="#fff4e8"/></linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f36f61"/><stop offset=".58" stop-color="#f6c65b"/><stop offset="1" stop-color="#d9e9f4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173a4e" flood-opacity=".15"/></filter>
    <clipPath id="sceneClip"><rect x="92" y="404" width="620" height="664" rx="48"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <text x="64" y="88" fill="#7a6857" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="4">SNAPCASE  •  WILL THIS PHOTO WORK?</text>
  <line x1="64" y1="124" x2="1016" y2="124" stroke="#172131" stroke-width="3"/>
  <text x="64" y="236" fill="#172131" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700">Try the crop test.</text>
  <text x="68" y="298" fill="#44515b" font-family="Arial, Helvetica, sans-serif" font-size="30">Three checks before you start designing.</text>

  <g filter="url(#shadow)"><rect x="64" y="360" width="676" height="752" rx="56" fill="#ffffff"/></g>
  <rect x="92" y="404" width="620" height="664" rx="48" fill="url(#scene)"/>
  <g clip-path="url(#sceneClip)">
    <circle cx="565" cy="575" r="88" fill="#fff3bd"/>
    <path d="M60 846 238 610 398 816 520 660 744 908v190H60Z" fill="#78a8c8"/>
    <path d="M52 944 266 760 444 938 586 810 744 1012v104H52Z" fill="#356382"/>
    <path d="M52 1020c198-118 390-102 692 24v100H52Z" fill="#163f53"/>
  </g>
  <rect x="182" y="482" width="438" height="492" rx="38" fill="none" stroke="#ffffff" stroke-width="9" stroke-dasharray="22 16"/>
  <path d="M182 566h72M182 566v72M620 566h-72M620 566v72M182 890h72M182 890v-72M620 890h-72M620 890v-72" fill="none" stroke="#f36f61" stroke-width="15" stroke-linecap="round"/>
  <circle cx="632" cy="468" r="52" fill="#172131"/>
  <path d="m608 470 16 17 32-39" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="782" y="404" fill="#7a6857" font-size="21" font-weight="700" letter-spacing="3">PHOTO CHECKLIST</text>

    <rect x="768" y="450" width="248" height="176" rx="34" fill="#ffffff"/>
    <circle cx="816" cy="498" r="27" fill="#f36f61"/><text x="816" y="508" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">1</text>
    <text x="804" y="552" fill="#172131" font-size="25" font-weight="700"><tspan x="804" dy="0">Leave breathing</tspan><tspan x="804" dy="31">room around</tspan><tspan x="804" dy="31">the subject</tspan></text>

    <rect x="768" y="654" width="248" height="176" rx="34" fill="#ffffff"/>
    <circle cx="816" cy="702" r="27" fill="#f6c65b"/><text x="816" y="712" text-anchor="middle" fill="#172131" font-size="23" font-weight="700">2</text>
    <text x="804" y="756" fill="#172131" font-size="25" font-weight="700"><tspan x="804" dy="0">Keep important</tspan><tspan x="804" dy="31">details inside</tspan><tspan x="804" dy="31">the crop</tspan></text>

    <rect x="768" y="858" width="248" height="176" rx="34" fill="#ffffff"/>
    <circle cx="816" cy="906" r="27" fill="#78a8c8"/><text x="816" y="916" text-anchor="middle" fill="#172131" font-size="23" font-weight="700">3</text>
    <text x="804" y="960" fill="#172131" font-size="25" font-weight="700"><tspan x="804" dy="0">Use the preview</tspan><tspan x="804" dy="31">to check</tspan><tspan x="804" dy="31">placement</tspan></text>
  </g>

  <rect x="64" y="1170" width="952" height="88" rx="44" fill="#ffffff" opacity=".94"/>
  <text x="540" y="1226" text-anchor="middle" fill="#56646e" font-family="Arial, Helvetica, sans-serif" font-size="23">Photo-crop guidance, not a print-quality guarantee.</text>
</svg>
